[package]
name = "cdn-payroll"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Canadian Payroll Library"
homepage = "https://statbook.io"
readme = "./README.md"
repository = "https://github.com/MrCartaaa/cdn-payroll"
authors = ["Carter Steele <office@statbook.io"]
keywords = ["Payroll-Tax", "Canadian-Payroll", "Payroll", "Tax"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
csv = "1.3.1"
dotenv = "0.15.0"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
